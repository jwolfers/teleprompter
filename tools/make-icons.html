<!doctype html>
<meta charset="utf-8">
<body>
<script>
const fs = require('fs');
const path = require('path');
const { ipcRenderer } = require('electron');

const root = path.join(__dirname, '..');
const PNG_SIZES = [16, 24, 32, 48, 64, 128, 192, 256, 512];
const ICO_SIZES = [16, 24, 32, 48, 64, 128, 256];

function rasterize(svg, size) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, size, size);
            ctx.drawImage(img, 0, 0, size, size);
            const b64 = c.toDataURL('image/png').split(',')[1];
            resolve(Buffer.from(b64, 'base64'));
        };
        img.onerror = () => reject(new Error('SVG failed to load into <img> at size ' + size));
        img.src = 'data:image/svg+xml;base64,' + btoa(svg);
    });
}

// Windows .ico with PNG-compressed entries (supported Vista+).
function buildIco(entries) {
    const count = entries.length;
    const header = Buffer.alloc(6);
    header.writeUInt16LE(0, 0);     // reserved
    header.writeUInt16LE(1, 2);     // type: icon
    header.writeUInt16LE(count, 4); // image count
    const dir = Buffer.alloc(16 * count);
    let offset = 6 + 16 * count;
    entries.forEach((e, i) => {
        const base = i * 16;
        dir.writeUInt8(e.size >= 256 ? 0 : e.size, base + 0); // width (0 = 256)
        dir.writeUInt8(e.size >= 256 ? 0 : e.size, base + 1); // height (0 = 256)
        dir.writeUInt8(0, base + 2);          // palette
        dir.writeUInt8(0, base + 3);          // reserved
        dir.writeUInt16LE(1, base + 4);       // color planes
        dir.writeUInt16LE(32, base + 6);      // bits per pixel
        dir.writeUInt32LE(e.buf.length, base + 8);
        dir.writeUInt32LE(offset, base + 12);
        offset += e.buf.length;
    });
    return Buffer.concat([header, dir, ...entries.map(e => e.buf)]);
}

(async () => {
    try {
        const svg = fs.readFileSync(path.join(root, 'favicon.svg'), 'utf8');
        const pngs = {};
        for (const s of PNG_SIZES) {
            pngs[s] = await rasterize(svg, s);
            fs.writeFileSync(path.join(root, `icon-${s}.png`), pngs[s]);
        }
        const ico = buildIco(ICO_SIZES.map(s => ({ size: s, buf: pngs[s] })));
        fs.writeFileSync(path.join(root, 'icon.ico'), ico);
        fs.mkdirSync(path.join(root, 'build'), { recursive: true });
        fs.writeFileSync(path.join(root, 'build', 'icon.ico'), ico);
        ipcRenderer.send('icons-done', `${PNG_SIZES.length} PNGs + icon.ico (${ICO_SIZES.length} sizes)`);
    } catch (err) {
        ipcRenderer.send('icons-error', err && err.stack ? err.stack : String(err));
    }
})();
</script>
</body>
