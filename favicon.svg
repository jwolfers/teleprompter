<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brand tile (Platypus Economics teal) -->
  <rect width="32" height="32" rx="7" fill="#2f9e97"/>
  <!-- Teleprompter glass / dark screen -->
  <rect x="4.5" y="6" width="23" height="20" rx="3" fill="#07211f"/>
  <!-- Dimmed line above the reading line -->
  <rect x="9" y="10.4" width="13" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
  <!-- Bright active reading line -->
  <rect x="9" y="15" width="14.5" height="2.6" rx="1.3" fill="#ffffff"/>
  <!-- Current-line caret (amber accent, matches riff highlight) -->
  <path d="M5.4 14.7 L8 16.3 L5.4 17.9 Z" fill="#f0c040"/>
  <!-- Dimmed line below the reading line -->
  <rect x="9" y="20" width="11" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
</svg>
