<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#2f9e97"/>
  <!-- Document body -->
  <rect x="8" y="4" width="16" height="24" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Text lines (dimmed above reading line) -->
  <line x1="11" y1="8" x2="21" y2="8" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="11.5" x2="19" y2="11.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Active reading line - bright -->
  <line x1="11" y1="15" x2="21" y2="15" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Reading position indicator -->
  <line x1="6" y1="15" x2="26" y2="15" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
  <!-- Text lines (dimmed below) -->
  <line x1="11" y1="18.5" x2="20" y2="18.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="22" x2="17" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="25.5" x2="21" y2="25.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Down arrow indicating scroll -->
  <path d="M24 22 L26 24.5 L28 22" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
