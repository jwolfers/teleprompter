<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <!-- EDIT VIEW: Where user pastes/edits their script -->
    <div id="edit-view">
        <div class="edit-header">
            <h1>Teleprompter</h1>
            <div class="edit-actions">
                <button id="btn-clear" title="Clear all text">Clear</button>
                <button id="btn-start" class="primary">Start Prompter</button>
            </div>
        </div>
        <div class="edit-instructions">
            Paste your script below. Formatting from Google Docs is preserved.
            <em>Italics</em> or "riff:" signal tangent sections.
            <span class="bracket-example">[Bracketed text]</span> = stage directions (not spoken).
        </div>
        <div id="editor" contenteditable="true" spellcheck="false">
            <p>Paste your script here...</p>
        </div>
    </div>

    <!-- PROMPTER VIEW: The teleprompter display -->
    <div id="prompter-view" class="hidden">
        <!-- Control bar at top -->
        <div id="control-bar">
            <div class="control-group">
                <button id="btn-back" title="Back to editor">&#9664; Edit</button>
            </div>

            <div class="control-group">
                <label>Font</label>
                <select id="ctrl-font">
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                    <option value="Palatino, serif">Palatino</option>
                    <option value="'Segoe UI', sans-serif">Segoe UI</option>
                </select>
            </div>

            <div class="control-group">
                <label>Size</label>
                <input type="range" id="ctrl-font-size" min="8" max="96" value="40">
                <input type="number" id="font-size-val" min="8" max="96" value="40" class="spinner">
            </div>

            <div class="control-group">
                <label>Spacing</label>
                <input type="range" id="ctrl-line-height" min="100" max="300" value="160">
                <input type="number" id="line-height-val" min="100" max="300" value="160" class="spinner">
            </div>

            <div class="control-group">
                <label>Width</label>
                <input type="range" id="ctrl-width" min="30" max="100" value="70">
                <input type="number" id="width-val" min="30" max="100" value="70" class="spinner">
            </div>

            <div class="control-group">
                <label>Text</label>
                <input type="color" id="ctrl-text-color" value="#ffffff">
            </div>

            <div class="control-group">
                <label>BG</label>
                <input type="color" id="ctrl-bg-color" value="#000000">
            </div>

            <div class="control-group">
                <label>Speed</label>
                <input type="range" id="ctrl-speed" min="0" max="100" value="30">
                <input type="number" id="speed-val" min="0" max="100" value="30" class="spinner">
            </div>

            <div class="control-group">
                <button id="btn-mirror" title="Mirror/flip text horizontally">Mirror</button>
            </div>

            <div class="control-group">
                <button id="btn-fullscreen" title="Toggle fullscreen">&#x26F6; Fullscreen</button>
            </div>
        </div>

        <!-- Prompter content area -->
        <div id="prompter-container">
            <div id="prompter-content"></div>
        </div>

        <!-- Bottom transport controls -->
        <div id="transport-bar">
            <div class="control-group">
                <div class="mode-toggle-group">
                    <span class="mode-label" id="mode-scroll-label">Scroll</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="ctrl-mode">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="mode-label" id="mode-listen-label">Listen</span>
                </div>
            </div>

            <div class="control-group listen-option hidden" id="speech-engine-group">
                <label>Engine</label>
                <select id="ctrl-speech-engine">
                    <option value="webspeech">Web Speech API (Free)</option>
                    <option value="openai" selected>OpenAI GPT-4o-mini ($0.003/min)</option>
                    <option value="openai-full">OpenAI GPT-4o ($0.006/min)</option>
                </select>
            </div>

            <div class="transport-spacer"></div>
            <button id="btn-play-pause" class="transport-btn">&#9654; Play</button>
            <button id="btn-reset" class="transport-btn">&#8634; Reset</button>
            <!-- Listen mode status -->
            <div id="listen-status" class="hidden">
                <span id="listen-indicator"></span>
                <span id="listen-text">Listening...</span>
                <span id="listen-cost" title="Estimated session cost">$0.00</span>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
